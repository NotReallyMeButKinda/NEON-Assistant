# Runs the unit tests on Windows, and the Linux port's tests on Linux, for every push and pull request. No
# microphone, Ollama or network services are needed: live tests are skipped unless NEON_LIVE=1, and screenshot
# comparisons are skipped (the baselines are drawn with one machine's fonts) while the clipped-text audit runs.
name: tests

on:
  push:
  pull_request:

jobs:
  unittest:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      NEON_SKIP_SCREENSHOTS: "1"
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run the tests
        run: python -m unittest discover -s tests -t . -v

  # The Linux port on a real Linux runner: the backends against a fake command runner, every module importing,
  # and the windows / hotkeys driving a fake Hyprland (each config dialect) and a fake KDE.
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y libportaudio2 libegl1 libxkbcommon0 libdbus-1-3 fonts-dejavu-core
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run the Linux tests
        run: python -m unittest tests.test_linux_backends tests.test_linux_imports tests.test_plasmoid -v
